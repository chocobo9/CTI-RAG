[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-cti"
version = "0.1.0"
description = "RAG-powered Cyber Threat Intelligence retrieval system"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "groq>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.9.0,<1.10.0",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.24.0",
    "unstructured[pdf]>=0.13.0",
    "stix2>=3.0.1",
    "langsmith>=0.1.0",
    "ragas>=0.1.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "datasets>=2.0.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]

[project.scripts]
rag-cti = "rag_cti.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_cti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=rag_cti",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--cov-config=pyproject.toml",
]

[tool.coverage.run]
omit = [
    "*/rag_cti/cli.py",
    "*/rag_cti/config.py",
    "*/rag_cti/connectors/otx.py",
    "*/rag_cti/connectors/virustotal.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
