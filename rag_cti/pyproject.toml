[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-cti"
version = "0.1.0"
description = "RAG-powered Cyber Threat Intelligence retrieval system"
requires-python = ">=3.11"

# ── Core: retrieval-only (no LLM, no PDF parsing, no eval) ─────────
# pip install -e .  →  ~300MB (Qdrant client + embedder + BM25)
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "qdrant-client>=1.9.0,<1.10.0",
    "sentence-transformers>=3.0.0",       # includes torch — heaviest dep
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "structlog>=24.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]

# ── Generation: LLM answer synthesis ───────────────────────────────
# pip install -e ".[generation]"  →  +~50MB
generation = [
    "anthropic>=0.40.0",
    "groq>=0.9.0",
    "openai>=1.0.0",                      # Ollama via OpenAI-compat
]

# ── M4 consumption layer: Neo4j fact graph (v0) + agentic loop (v1) ─
# pip install -e ".[agentic]"
agentic = [
    "neo4j>=6.0.0,<7.0.0",
    "langgraph>=1.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",            # DeepSeek via OpenAI-compatible endpoint
    "langchain-anthropic>=0.3.0",
]

# ── PDF: unstructured + pymupdf for CTI report ingestion ───────────
# pip install -e ".[pdf]"  →  +~200MB
pdf = [
    "pymupdf>=1.24.0",
    "unstructured[pdf]>=0.13.0",
]

# Source-corpus collection and local text extraction.
collection = [
    "pymupdf>=1.24.0",
]

# ── Connectors: OTX / VT API connectors + STIX parsing ────────────
# pip install -e ".[connectors]"  →  +~30MB
connectors = [
    "stix2>=3.0.1",
]

# ── Eval: TechniqueRAG benchmark + RAGAS + HuggingFace datasets ───
# pip install -e ".[eval]"  →  +~150MB
eval = [
    "ragas>=0.1.0",
    "datasets>=2.0.0",
]

# ── CLI: Typer + Rich terminal UI ─────────────────────────────────
# pip install -e ".[cli]"  →  +~10MB
cli = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]

# ── Observability: LangSmith tracing ──────────────────────────────
# pip install -e ".[tracing]"  →  +~20MB
tracing = [
    "langsmith>=0.1.0",
]

# ── Demo: minimum viable for advisor/classmate to try ─────────────
# pip install -e ".[demo]"  →  core + generation + cli (~400MB)
demo = [
    "rag-cti[generation]",
    "rag-cti[cli]",
]

# ── All: everything ───────────────────────────────────────────────
# pip install -e ".[all]"  →  full install
all = [
    "rag-cti[generation]",
    "rag-cti[pdf]",
    "rag-cti[connectors]",
    "rag-cti[eval]",
    "rag-cti[cli]",
    "rag-cti[tracing]",
    "rag-cti[collection]",
]

# ── Dev: all + testing + linting ──────────────────────────────────
dev = [
    "rag-cti[all]",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
]

[project.scripts]
rag-cti = "rag_cti.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_cti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--cov=rag_cti",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--cov-config=pyproject.toml",
]

# Omissions limited to modules with no meaningful unit-test surface:
# __init__ (public API wiring), cli (Typer commands, help-text tested only),
# config (pydantic Settings), techniquerag (needs HuggingFace network access).
# otx/virustotal/pdf_parser ARE tested and therefore measured.
[tool.coverage.run]
omit = [
    "*/rag_cti/__init__.py",
    "*/rag_cti/cli.py",
    "*/rag_cti/config.py",
    "*/rag_cti/evaluation/techniquerag.py",
    # LLM-orchestration + langgraph wiring (M4 v1); verified end-to-end, not unit-testable.
    "*/rag_cti/knowledge/agent_graph.py",
    # Agentic answer loop wiring (workflow->agentic); pure logic in agentic_nodes/
    # evidence_ledger IS unit-tested. This file is langgraph/langchain wiring, e2e-verified.
    "*/rag_cti/knowledge/agentic_graph.py",
    # Multi-agent supervisor wiring; pure logic in supervisor_nodes IS unit-tested. This
    # file is the langgraph branch-invoke + decompose-client wiring, e2e-verified.
    "*/rag_cti/knowledge/supervisor_graph.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
