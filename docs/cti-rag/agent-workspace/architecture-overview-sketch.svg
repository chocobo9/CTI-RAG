<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-labelledby="title desc">
  <title id="title">CTI-RAG target architecture</title>
  <desc id="desc">A hand-drawn architecture diagram showing user task, Workspace context assembly, Pi Agent Runtime with its Harness control layer and Session, Case Management, Intelligence and Evidence, and Memory Management.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2563eb" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#15803d" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#7e22ce" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#c2410c" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <style>
      .title { font: 700 42px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill:#1f2937; }
      .subtitle { font: 19px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill:#475569; }
      .label { font: 700 25px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill:#1f2937; }
      .small { font: 17px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill:#334155; }
      .tiny { font: 15px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif; fill:#475569; }
      .cap { font: 700 17px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Segoe UI", sans-serif; letter-spacing:1.2px; }
      .box { fill:#fff; stroke:#334155; stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; }
      .wire { fill:none; stroke-width:2.7; stroke-linecap:round; stroke-linejoin:round; }
      .dash { stroke-dasharray:8 8; }
    </style>
  </defs>

  <rect width="1920" height="1200" fill="#fffefb"/>
  <path d="M54 75 C500 64, 1310 75, 1850 69" class="wire" stroke="#ef4444" opacity=".6"/>
  <text x="62" y="58" class="title">CTI-RAG · Target Architecture</text>
  <text x="64" y="103" class="subtitle">一次用户任务：由 Workspace 组织，由 Pi 执行，以 Case / I&amp;E / Memory 的各自权威为边界</text>

  <!-- User entry -->
  <text x="76" y="180" class="cap" fill="#64748b">USER TASK</text>
  <rect x="62" y="204" width="220" height="86" rx="18" class="box" stroke="#16a34a" fill="#f0fdf4"/>
  <text x="92" y="240" class="label" fill="#15803d">User Task</text>
  <text x="92" y="267" class="small">原始任务 · 输入附件</text>
  <path d="M172 292 C172 316,172 325,172 348" class="wire" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <rect x="62" y="351" width="220" height="79" rx="18" class="box" stroke="#16a34a" fill="#f0fdf4"/>
  <text x="92" y="384" class="label" fill="#15803d">Task Intake</text>
  <text x="92" y="411" class="small">任务状态 / 路由</text>

  <!-- Workspace -->
  <text x="367" y="180" class="cap" fill="#15803d">WORKSPACE · CONTEXT ASSEMBLY</text>
  <path d="M348 191 C362 183,370 183,388 191" class="wire" stroke="#16a34a"/>
  <rect x="345" y="203" width="545" height="405" rx="28" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <path d="M347 205 C510 198,730 211,887 204" class="wire" stroke="#16a34a" opacity=".55"/>
  <text x="376" y="248" class="label" fill="#15803d">Workspace</text>
  <text x="376" y="276" class="small">为当前任务组装“可以进入模型”的上下文</text>

  <rect x="380" y="308" width="198" height="77" rx="14" class="box" stroke="#16a34a" fill="#ffffff"/>
  <text x="402" y="340" class="label" font-size="21">Task State</text>
  <text x="402" y="365" class="tiny">目标 · 范围 · 用途</text>

  <rect x="620" y="308" width="224" height="77" rx="14" class="box" stroke="#ef4444" fill="#fff7ed"/>
  <text x="640" y="340" class="label" font-size="21" fill="#dc2626">Case Orientation</text>
  <text x="640" y="365" class="tiny">当前可见的案件方向</text>

  <rect x="380" y="420" width="198" height="77" rx="14" class="box" stroke="#2563eb" fill="#eff6ff"/>
  <text x="402" y="452" class="label" font-size="21" fill="#1d4ed8">Session History</text>
  <text x="402" y="477" class="tiny">已选的历史上下文</text>

  <rect x="620" y="420" width="224" height="77" rx="14" class="box" stroke="#c2410c" fill="#fff7ed"/>
  <text x="640" y="452" class="label" font-size="21" fill="#c2410c">Tool Registration</text>
  <text x="640" y="477" class="tiny">当前允许的能力</text>

  <rect x="480" y="526" width="272" height="53" rx="13" class="box" stroke="#7e22ce" fill="#faf5ff"/>
  <text x="508" y="559" class="label" font-size="21" fill="#7e22ce">Memory Revalidate</text>

  <path d="M282 390 C315 390,319 327,345 327" class="wire" stroke="#16a34a" marker-end="url(#arrow-green)"/>
  <text x="287" y="337" class="tiny" fill="#15803d">route</text>

  <!-- Pi Runtime -->
  <text x="980" y="180" class="cap" fill="#2563eb">PI AGENT RUNTIME · EXECUTION SPINE</text>
  <rect x="948" y="203" width="870" height="590" rx="30" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <path d="M950 205 C1160 198,1520 211,1816 204" class="wire" stroke="#2563eb" opacity=".55"/>
  <text x="980" y="248" class="label" fill="#1d4ed8">Pi Agent Runtime</text>
  <text x="980" y="275" class="small">Pi 的通用执行平面；Workspace 只注入 CTI 任务规则与上下文</text>

  <!-- Harness layer -->
  <rect x="980" y="302" width="805" height="300" rx="25" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
  <path d="M983 304 C1180 295,1565 310,1781 303" class="wire" stroke="#7e22ce" opacity=".5"/>
  <text x="1010" y="345" class="label" fill="#7e22ce">AgentHarness · Workspace-lifetime control layer</text>
  <text x="1010" y="371" class="tiny">不是流水线节点：它把模型、工具、Session、保存与终止控制组织成一次受控运行</text>

  <rect x="1016" y="401" width="190" height="82" rx="15" class="box" stroke="#7e22ce" fill="#ffffff"/>
  <text x="1041" y="434" class="label" font-size="20">Model Config</text>
  <text x="1041" y="459" class="tiny">模型 · thinking</text>

  <rect x="1244" y="401" width="195" height="82" rx="15" class="box" stroke="#c2410c" fill="#ffffff"/>
  <text x="1276" y="434" class="label" font-size="20" fill="#c2410c">Active Tools</text>
  <text x="1276" y="459" class="tiny">调用前 / 后控制</text>

  <rect x="1477" y="401" width="268" height="82" rx="15" class="box" stroke="#2563eb" fill="#ffffff"/>
  <text x="1502" y="434" class="label" font-size="20" fill="#1d4ed8">Provider Dispatch</text>
  <text x="1502" y="459" class="tiny">最终输入、工具、计数与回执</text>

  <rect x="1016" y="515" width="180" height="60" rx="15" class="box" stroke="#15803d" fill="#ffffff"/>
  <text x="1040" y="552" class="label" font-size="21" fill="#15803d">Save Points</text>
  <rect x="1244" y="515" width="195" height="60" rx="15" fill="#fff7ed" stroke="#f59e0b" stroke-width="2.8"/>
  <text x="1268" y="552" class="label" font-size="20" fill="#c2410c">Pi Agent Loop</text>
  <rect x="1477" y="515" width="268" height="60" rx="15" class="box" stroke="#e11d48" fill="#ffffff"/>
  <text x="1511" y="552" class="label" font-size="21" fill="#e11d48">Run Settlement</text>

  <!-- Session layer / loop -->
  <rect x="980" y="632" width="805" height="124" rx="22" fill="#ffffff" stroke="#334155" stroke-width="2.7"/>
  <text x="1011" y="671" class="label" fill="#334155">Pi Session · durable history &amp; committed facts</text>
  <text x="1011" y="697" class="tiny">对话树 · 工具结果 · 配置 · 保存点 · 回执 · 分支与压缩</text>
  <text x="1011" y="725" class="tiny">Harness / Agent Loop 使用它、并把已提交事实写回它；Session 本身不拥有 Agent Loop</text>
  <path d="M1342 575 C1342 596,1342 608,1342 630" class="wire" stroke="#334155" marker-end="url(#arrow-blue)"/>
  <text x="1356" y="613" class="tiny">commit to</text>

  <path d="M890 400 C917 400,921 400,947 400" class="wire" stroke="#2563eb" marker-end="url(#arrow-blue)"/>
  <text x="895" y="382" class="tiny" fill="#1d4ed8">qualified context</text>

  <!-- Case management -->
  <text x="68" y="528" class="cap" fill="#dc2626">CASE MANAGEMENT · AUTHORITY</text>
  <rect x="62" y="551" width="220" height="150" rx="22" fill="#fff1f2" stroke="#ef4444" stroke-width="3"/>
  <text x="90" y="591" class="label" fill="#dc2626">Case Management</text>
  <text x="90" y="621" class="small">案件状态</text>
  <text x="90" y="647" class="small">人工方向 / 正式事实</text>
  <text x="90" y="675" class="tiny">受控写入：后续阶段</text>
  <path d="M282 610 C321 610,321 359,620 359" class="wire" stroke="#ef4444" marker-end="url(#arrow-orange)"/>
  <text x="305" y="588" class="tiny" fill="#dc2626">actor-scoped orientation</text>

  <!-- IE -->
  <text x="1040" y="855" class="cap" fill="#c2410c">I&amp;E PLATFORM · SOURCES &amp; EVIDENCE</text>
  <rect x="1014" y="878" width="390" height="188" rx="24" fill="#fff7ed" stroke="#c2410c" stroke-width="3"/>
  <text x="1045" y="921" class="label" fill="#c2410c">Intelligence &amp; Evidence</text>
  <text x="1045" y="952" class="small">OpenCTI 资源 / 精确资料 / 来源版本</text>
  <text x="1045" y="980" class="small">span · lineage · retrieval receipt</text>
  <text x="1045" y="1018" class="tiny">I&amp;E 拥有资料与溯源；Workspace 只决定本任务是否准入</text>
  <path d="M1405 973 C1475 973,1540 885,1550 730" class="wire" stroke="#c2410c" marker-end="url(#arrow-orange)"/>
  <text x="1455" y="917" class="tiny" fill="#c2410c">qualified tool result</text>

  <!-- Memory -->
  <text x="70" y="785" class="cap" fill="#7e22ce">MEMORY MANAGEMENT · DURABLE LIFECYCLE</text>
  <rect x="62" y="809" width="845" height="258" rx="27" fill="#faf5ff" stroke="#7e22ce" stroke-width="3"/>
  <text x="94" y="851" class="label" fill="#7e22ce">Agent Memory Management</text>
  <text x="94" y="878" class="small">不复制 Case / I&amp;E 权威；保存可复用的修订与对来源的可验证引用</text>

  <rect x="96" y="913" width="194" height="102" rx="16" class="box" stroke="#15803d" fill="#f0fdf4"/>
  <text x="118" y="946" class="label" font-size="20" fill="#15803d">User edits</text>
  <text x="118" y="971" class="tiny">Git-backed Markdown</text>
  <text x="118" y="993" class="tiny">显式记住 / 更正 / 忘记</text>

  <rect x="352" y="913" width="205" height="102" rx="16" class="box" stroke="#7e22ce" fill="#ffffff"/>
  <text x="382" y="946" class="label" font-size="20" fill="#7e22ce">Candidate</text>
  <text x="382" y="971" class="tiny">已结算 Run 的结构化</text>
  <text x="382" y="993" class="tiny">语义 / 情节 / 程序候选</text>

  <rect x="619" y="913" width="230" height="102" rx="16" class="box" stroke="#7e22ce" fill="#ffffff"/>
  <text x="653" y="946" class="label" font-size="20" fill="#7e22ce">Admit &amp; Revise</text>
  <text x="653" y="971" class="tiny">来源 · 范围 · 权限 · 冲突</text>
  <text x="653" y="993" class="tiny">修订 · 失效 · 删除</text>

  <path d="M290 964 C317 964,322 964,351 964" class="wire" stroke="#7e22ce" marker-end="url(#arrow-purple)"/>
  <path d="M557 964 C583 964,590 964,618 964" class="wire" stroke="#7e22ce" marker-end="url(#arrow-purple)"/>

  <path d="M1600 757 C1600 823,1200 815,850 914" class="wire dash" stroke="#7e22ce" marker-end="url(#arrow-purple)"/>
  <text x="1188" y="810" class="tiny" fill="#7e22ce">settled Session / tool / audit facts → candidates</text>
  <path d="M750 913 C753 820,753 682,753 579" class="wire dash" stroke="#7e22ce" marker-end="url(#arrow-purple)"/>
  <text x="765" y="744" class="tiny" fill="#7e22ce">prepare + revalidate</text>

  <!-- Legend -->
  <path d="M1456 1108 C1555 1101,1716 1109,1815 1104" class="wire" stroke="#94a3b8"/>
  <rect x="1017" y="1092" width="18" height="18" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1046" y="1108" class="tiny">Pi runtime</text>
  <rect x="1178" y="1092" width="18" height="18" rx="4" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1207" y="1108" class="tiny">Workspace</text>
  <rect x="1347" y="1092" width="18" height="18" rx="4" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/>
  <text x="1376" y="1108" class="tiny">Memory</text>
  <rect x="1493" y="1092" width="18" height="18" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
  <text x="1522" y="1108" class="tiny">I&amp;E</text>
  <rect x="1630" y="1092" width="18" height="18" rx="4" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
  <text x="1659" y="1108" class="tiny">Case authority</text>
  <text x="64" y="1142" class="tiny">实线：主要运行/资料流　·　虚线：受结算与再验证约束的 Memory 生命周期流</text>
</svg>
